[project]
name = "avoxi-audit"
version = "0.4.0"
description = "AI auditor for Avoxi's call journey - detects unanswered calls during on-call hours."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
audit = "avoxi_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avoxi_audit"]
